<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A little something for you ❤️</title>
<style>
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f5e6d3;
    background: #1a0515;
  }

  body {
    background: radial-gradient(circle at 50% 40%, #521740 0%, #2a0a20 55%, #12030c 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    user-select: none;
  }

  /* ============ TOP PROMPT ============ */
  .prompt {
    position: fixed;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(15px, 3vw, 19px);
    font-weight: 600;
    text-align: center;
    padding: 12px 24px;
    background: rgba(60, 20, 45, 0.55);
    border: 1px solid rgba(232, 193, 104, 0.35);
    border-radius: 999px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(232, 193, 104, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
    z-index: 20;
    max-width: 92vw;
    line-height: 1.4;
    animation: promptGlow 3.2s ease-in-out infinite;
    transition: opacity 0.8s ease;
  }

  .prompt.fade {
    opacity: 0.35;
  }

  @keyframes promptGlow {
    0%, 100% {
      box-shadow: 0 8px 32px rgba(232, 193, 104, 0.15),
                  inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    50% {
      box-shadow: 0 8px 42px rgba(232, 193, 104, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
  }

  /* ============ STAGE ============ */
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============ MESSAGE ============ */
  .message-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(90vw, 720px);
    z-index: 2;
    pointer-events: none;
    padding: 0 20px;
  }

  .message {
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 1s ease 0.35s,
                transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s;
    font-size: clamp(19px, 3.6vw, 28px);
    line-height: 1.5;
    font-weight: 500;
    text-align: center;
    color: #f5e6d3;
    padding: 26px 30px;
    background: rgba(60, 20, 45, 0.45);
    border: 1px solid rgba(232, 193, 104, 0.28);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-shadow: 0 2px 24px rgba(255, 143, 192, 0.25);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .message.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* ============ BOX ============ */
  .box-stage {
    position: relative;
    width: min(72vw, 320px);
    height: min(72vw, 320px);
    z-index: 3;
    cursor: pointer;
    animation: boxBounce 2.6s ease-in-out infinite;
    transition: opacity 0.6s ease 1.35s;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.55));
  }

  .box-stage.opened {
    animation: none;
    pointer-events: none;
    opacity: 0;
  }

  @keyframes boxBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .flap {
    position: absolute;
    width: 50%;
    height: 50%;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, transparent 55%),
      linear-gradient(135deg, #5c2044 0%, #2e0c22 100%);
    box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.45),
                inset 0 2px 0 rgba(255, 255, 255, 0.05);
    transition: transform 1.15s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.55s ease 0.85s;
  }

  .flap-tl {
    top: 0; left: 0;
    transform-origin: 0 0;
    border-top-left-radius: 10px;
  }
  .flap-tr {
    top: 0; right: 0;
    transform-origin: 100% 0;
    border-top-right-radius: 10px;
  }
  .flap-bl {
    bottom: 0; left: 0;
    transform-origin: 0 100%;
    border-bottom-left-radius: 10px;
  }
  .flap-br {
    bottom: 0; right: 0;
    transform-origin: 100% 100%;
    border-bottom-right-radius: 10px;
  }

  .box-stage.opened .flap-tl { transform: rotate(-180deg); opacity: 0; }
  .box-stage.opened .flap-tr { transform: rotate(180deg);  opacity: 0; }
  .box-stage.opened .flap-bl { transform: rotate(180deg);  opacity: 0; }
  .box-stage.opened .flap-br { transform: rotate(-180deg); opacity: 0; }

  /* ============ RIBBON ============ */
  .ribbon {
    position: absolute;
    background: linear-gradient(
      90deg,
      #a8842e 0%,
      #e8c168 20%,
      #f7e08a 50%,
      #e8c168 80%,
      #a8842e 100%
    );
    box-shadow: 0 0 12px rgba(232, 193, 104, 0.4),
                inset 0 0 6px rgba(0, 0, 0, 0.2);
    z-index: 5;
    overflow: hidden;
    transition: opacity 0.35s ease, transform 0.4s ease;
  }

  .ribbon::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 8px,
      rgba(255, 255, 255, 0.22) 8px,
      rgba(255, 255, 255, 0.22) 10px,
      transparent 10px,
      transparent 20px
    );
    animation: ribbonShimmer 3s linear infinite;
    pointer-events: none;
  }

  @keyframes ribbonShimmer {
    from { transform: translate(-20px, -20px); }
    to   { transform: translate(20px, 20px); }
  }

  .ribbon-v {
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
  }

  .ribbon-h {
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 32px;
  }

  .box-stage.opened .ribbon {
    opacity: 0;
    transform: translateX(-50%) translateY(-30px) scale(0.85);
  }

  .box-stage.opened .ribbon-h {
    transform: translateY(-50%) translateY(-30px) scale(0.85);
  }

  /* ============ BOW ============ */
  .bow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 112px;
    height: 62px;
    z-index: 6;
    transition: opacity 0.35s ease, transform 0.45s ease;
  }

  .bow-loop {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: radial-gradient(
      circle at 35% 30%,
      #f7e08a 0%,
      #e8c168 45%,
      #a8842e 100%
    );
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35),
                inset 0 -4px 8px rgba(0, 0, 0, 0.25),
                inset 0 3px 6px rgba(255, 255, 255, 0.2);
  }

  .bow-left {
    left: 0;
    border-radius: 62% 38% 60% 40% / 55% 55% 45% 45%;
    transform: skewX(6deg) rotate(-3deg);
  }

  .bow-right {
    right: 0;
    border-radius: 38% 62% 40% 60% / 55% 55% 45% 45%;
    transform: skewX(-6deg) rotate(3deg);
  }

  .bow-knot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #e8c168, #7a5c18);
    border-radius: 50%;
    box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.25),
                0 2px 6px rgba(0, 0, 0, 0.4);
    z-index: 2;
  }

  .bow-heart {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    color: #f5e6d3;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55),
                 0 0 6px rgba(245, 230, 211, 0.3);
    z-index: 3;
    line-height: 1;
    pointer-events: none;
  }

  .box-stage.opened .bow {
    opacity: 0;
    transform: translate(-50%, -50%) translateY(-40px) scale(1.15) rotate(8deg);
  }

  /* ============ CONFETTI CANVAS ============ */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* ============ SMALL SCREENS ============ */
  @media (max-width: 500px) {
    .prompt { top: 22px; font-size: 14px; padding: 10px 18px; }
    .message { padding: 22px 22px; font-size: 18px; }
    .bow { width: 92px; height: 52px; }
  }
</style>
</head>
<body>

  <div class="prompt" id="prompt">
    ❤️ Hey there love, tap the ribbon to open your prezzie ❤️
  </div>

  <div class="stage">

    <div class="message-wrap">
      <div class="message" id="message">
        🥰 Thank you for your constant love and support, you deserve more than just a special message 😈
      </div>
    </div>

    <div class="box-stage" id="boxStage" role="button" aria-label="Open the prezzie">
      <div class="flap flap-tl"></div>
      <div class="flap flap-tr"></div>
      <div class="flap flap-bl"></div>
      <div class="flap flap-br"></div>

      <div class="ribbon ribbon-v"></div>
      <div class="ribbon ribbon-h"></div>

      <div class="bow">
        <div class="bow-loop bow-left"></div>
        <div class="bow-loop bow-right"></div>
        <div class="bow-knot"></div>
        <div class="bow-heart">♥</div>
      </div>
    </div>

  </div>

  <canvas id="confetti"></canvas>

<script>
(function () {
  "use strict";

  /* =======================================================================
     ELEMENTS
     ======================================================================= */
  const boxStage = document.getElementById("boxStage");
  const message = document.getElementById("message");
  const promptEl = document.getElementById("prompt");
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  /* =======================================================================
     CANVAS SIZING
     ======================================================================= */
  let W = 0, H = 0;
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  /* =======================================================================
     SHAPE DRAWING
     ======================================================================= */
  function drawHeart(cx, cy, size) {
    const s = size;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.75);
    ctx.bezierCurveTo(
      cx - s * 1.25, cy - s * 0.35,
      cx - s * 0.55, cy - s * 1.25,
      cx, cy - s * 0.45
    );
    ctx.bezierCurveTo(
      cx + s * 0.55, cy - s * 1.25,
      cx + s * 1.25, cy - s * 0.35,
      cx, cy + s * 0.75
    );
    ctx.closePath();
    ctx.fill();
  }

  function drawStar(cx, cy, spikes, outerR, innerR) {
    let rot = -Math.PI / 2;
    const step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    for (let i = 0; i < spikes; i++) {
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    }
    ctx.closePath();
    ctx.fill();
  }

  /* =======================================================================
     CONFETTI
     ======================================================================= */
  const particles = [];
  let animating = false;

  function makeParticle(type, cx, cy) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 4.5 + Math.random() * 7.5;
    const vx = Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed - 5.5;

    let size, color;
    if (type === "heartSmall") {
      size = 4.5 + Math.random() * 2.5;
      color = "#ff9ec7";
    } else if (type === "heartMed") {
      size = 8 + Math.random() * 3.5;
      color = "#a8103c";
    } else {
      size = 6 + Math.random() * 2.5;
      color = "#e8c168";
    }

    return {
      type: type,
      x: cx + (Math.random() - 0.5) * 24,
      y: cy + (Math.random() - 0.5) * 24,
      vx: vx,
      vy: vy,
      size: size,
      color: color,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.14,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.018 + Math.random() * 0.03,
      life: 1,
      age: 0,
      dead: false
    };
  }

  function spawnConfetti() {
    const cx = W / 2;
    const cy = H / 2;

    // 81 total = 27 of each type
    const perType = 27;
    for (let i = 0; i < perType; i++) {
      particles.push(makeParticle("heartSmall", cx, cy));
      particles.push(makeParticle("heartMed", cx, cy));
      particles.push(makeParticle("star", cx, cy));
    }

    if (!animating) {
      animating = true;
      requestAnimationFrame(loop);
    }
  }

  function updateParticle(p) {
    // Motion
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.11;           // gravity
    p.vx *= 0.994;          // air drag
    p.vy *= 0.994;

    // Sway
    p.wobble += p.wobbleSpeed;
    p.x += Math.sin(p.wobble) * 0.45;

    // Spin
    p.rotation += p.rotSpeed;

    // Age-based fade (starts after ~12 seconds, over ~6 seconds)
    p.age++;
    if (p.age > 720) {
      p.life -= 0.003;
    }

    // Off screen or faded out
    if (p.life <= 0 || p.y > H + 60) {
      p.dead = true;
    }
  }

  function drawParticle(p) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.fillStyle = p.color;

    if (p.type === "star") {
      // Outer gold star
      drawStar(0, 0, 5, p.size, p.size * 0.48);
      // Bright inner core for a subtle glitter feel
      ctx.fillStyle = "#fff2b8";
      drawStar(0, 0, 5, p.size * 0.42, p.size * 0.2);
    } else {
      drawHeart(0, 0, p.size);
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, W, H);

    // Update & draw
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      updateParticle(p);
      if (p.dead) {
        particles.splice(i, 1);
        continue;
      }
      drawParticle(p);
    }

    if (particles.length > 0) {
      requestAnimationFrame(loop);
    } else {
      animating = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  /* =======================================================================
     OPEN SEQUENCE
     ======================================================================= */
  let opened = false;

  function openBox() {
    if (opened) return;
    opened = true;

    // Trigger the box unfold animation
    boxStage.classList.add("opened");

    // Burst of confetti
    spawnConfetti();

    // Reveal the message (fades in behind the opening flaps)
    setTimeout(() => {
      message.classList.add("visible");
    }, 380);

    // Dim the top prompt slightly once opened
    setTimeout(() => {
      promptEl.classList.add("fade");
    }, 1400);
  }

  // Tap anywhere on the box
  boxStage.addEventListener("click", openBox);
  boxStage.addEventListener("pointerdown", (e) => {
    // Prevent double-fire on touch devices
    e.preventDefault();
    openBox();
  });

})();
</script>

</body>
</html>
